<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلبات المندوب</title>
<!-- PWA -->
<link rel="manifest" href="manifest-driver.json">
<meta name="theme-color" content="#10a66a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="التوصيل">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#17201c;font-family:Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.header{height:64px;background:#10a66a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:4}.header h1{font-size:20px;margin:0}
.wrap{max-width:760px;margin:auto;padding:12px;width:100%}.search{width:100%;border:1px solid #e1e7e4;background:#fff;border-radius:12px;padding:12px 15px;margin-bottom:10px}
.filters{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.filter{border:0;background:#e9eeec;color:#3f4b46;border-radius:18px;padding:7px 13px;white-space:nowrap}.filter.active{background:#10a66a;color:#fff}
.card{background:#fff;border-radius:15px;margin-bottom:10px;padding:14px;box-shadow:0 2px 10px #0000000b}.head{display:flex;justify-content:space-between;gap:8px}.name{font-weight:700;font-size:17px}.phone{font-size:12px;color:#69736e;margin-top:3px}.status{font-size:11px;padding:5px 9px;border-radius:14px;background:#fff0cf;color:#9a6900;height:max-content}.status.out{background:#e4f0ff;color:#1464b8}.status.done{background:#e2f6e8;color:#13844d}.status.cancel{background:#ffe7e7;color:#b32d2d}.info{font-size:13px;line-height:1.8;color:#515b57;margin:8px 0}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.btn{border:0;border-radius:10px;padding:9px 7px;background:#edf7f2;color:#087f4f;font-weight:700}.btn.green{background:#10a66a;color:#fff}.btn.red{background:#ffe8e8;color:#b22e2e}
.empty{text-align:center;padding:70px 15px;color:#737e79}.modal{position:fixed;inset:0;background:#0008;z-index:10;display:flex;align-items:flex-end;justify-content:center}.hidden{display:none!important}.sheet{width:min(700px,100%);background:#fff;border-radius:22px 22px 0 0;padding:18px;max-height:94vh;overflow:auto}.sheethead{display:flex;align-items:center;justify-content:space-between}.sheet h2{font-size:20px;margin:0 0 12px}.x{border:0;background:#eef1ef;border-radius:10px;width:38px;height:38px;font-size:22px}
label{display:block;font-size:13px;font-weight:700;margin:9px 0}label input{display:block;width:100%;margin-top:5px;border:1px solid #d9e2de;border-radius:11px;background:#fff;padding:12px;outline:0;color:#17201c}
.save{width:100%;border:0;background:#10a66a;color:#fff;border-radius:12px;padding:13px;margin-top:12px;font-weight:800}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);background:#17201c;color:#fff;padding:10px 16px;border-radius:11px;opacity:0;transition:.2s;z-index:20;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:650px){.modal{align-items:center}.sheet{border-radius:20px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{margin:0}}
@media(max-width:520px){.actions{grid-template-columns:1fr 1fr}.actions .full{grid-column:1/-1}}
@media(min-width:1000px){.wrap{max-width:1180px}.cards{grid-template-columns:1fr 1fr 1fr}.loginCard{padding:32px}}
.userbox{display:flex;align-items:center;gap:8px}.logout{border:0;border-radius:9px;padding:6px 10px;background:#ffffff22;color:#fff}.login{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center}.loginCard{width:min(430px,100%);background:#fff;border-radius:20px;padding:24px;box-shadow:0 5px 25px #00000012;text-align:center}.loginIcon{font-size:50px}.loginCard h2{margin:8px 0}.loginCard p{color:#6d7772;margin-top:0}.demo{font-size:11px;color:#7a8580;margin-top:10px;line-height:1.8}.adminTools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.tool{border:0;background:#fff;border-radius:11px;padding:10px 12px;box-shadow:0 2px 8px #0000000b;color:#087f4f;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<header class="header"><span>🛵</span><h1 id="appTitle">طلبات المندوب</h1><div class="userbox"><button id="logout" class="logout hidden">خروج</button></div></header>

<section id="login" class="login wrap">
 <div class="loginCard">
  <div class="loginIcon">🛵</div><h2>طلبات المندوب</h2><p>سجّل الدخول لحسابك</p>
  <label>اسم المستخدم<input id="loginUser" type="text" placeholder="mando2" autocomplete="username"></label>
  <label>كلمة المرور<input id="loginPass" type="password" placeholder="كلمة المرور" autocomplete="current-password"></label>
  <button id="loginBtn" class="save">دخول</button>
  <div id="authDiag" class="demo"></div>
 </div>
</section>

<div id="app" class="hidden">
<main class="wrap">
<div id="driverTools" class="adminTools"><button id="dailySummaryBtn" class="tool">📊 ملخص اليوم</button></div>
<input id="search" class="search" type="search" placeholder="بحث باسم العميل أو رقم الهاتف" autocomplete="off">
<div class="filters">
<button class="filter active" data-f="الكل">الكل</button><button class="filter" data-f="جديد">جديد</button><button class="filter" data-f="جاري التوصيل">جاري التوصيل</button><button class="filter" data-f="تم التسليم">تم التسليم</button><button class="filter" data-f="ملغي">ملغي</button>
</div>
<div id="stats" style="font-size:13px;color:#65716b;margin:8px 3px 10px"></div>
<div id="cards" class="cards"></div>
</main>

<div id="statusModal" class="modal hidden"><div class="sheet">
<div class="sheethead"><h2>تغيير الحالة</h2><button id="statusClose" class="x">×</button></div>
<div id="statusList"></div>
</div></div>

<div id="summaryModal" class="modal hidden"><div class="sheet">
<div class="sheethead"><h2>📊 ملخص اليوم</h2><button id="summaryClose" class="x">×</button></div>
<div id="summaryContent" style="text-align:center;padding:10px 0"></div>
</div></div>

</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";
// ============================================================
// إعداد Supabase
// ============================================================
const SUPABASE_URL="https://urfxuimhyvwfjnfjsojp.supabase.co";
const SUPABASE_KEY="sb_publishable_sknSMSPhfT7gOkoiG-w1lQ_uamIQGdz";
const DRIVER_EMAIL_DOMAIN="@driver.local";

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.classList.remove("show"),3200)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

// ============================================================
// الحالة العامة
// ============================================================
let currentUser=null;   // {id, auth_uid, username, name, role:"driver"}
let orders=[];
let filter="الكل";
let searchTerm="";
let ordersChannel=null;
let watchId=null;

// ============================================================
// تسجيل الدخول / الخروج
// ============================================================
$("loginBtn").onclick=async()=>{
  const u=$("loginUser").value.trim(),p=$("loginPass").value;
  if(!u||!p){toast("اكتب البيانات كاملة");return}
  const email=u.toLowerCase().replace(/@.*$/,"")+DRIVER_EMAIL_DOMAIN;
  try{
    const{error}=await sb.auth.signInWithPassword({email,password:p});
    if(error){toast(error.message==="Invalid login credentials"?"اسم المستخدم أو كلمة المرور غلط":"تعذر الدخول: "+error.message);return}
  }catch(e){
    toast("خطأ فني: "+(e&&e.message?e.message:String(e)));
  }
};

$("logout").onclick=async()=>{await sb.auth.signOut()};

sb.auth.onAuthStateChange(async(event,session)=>{
  if(!session){
    stopLocationWatch();
    if(ordersChannel){sb.removeChannel(ordersChannel);ordersChannel=null}
    currentUser=null;orders=[];
    $("app").classList.add("hidden");$("login").classList.remove("hidden");$("logout").classList.add("hidden");
    return;
  }
  const{data:profile,error}=await sb.from("app_users").select("*").eq("auth_uid",session.user.id).maybeSingle();
  if(error||!profile||profile.role!=="driver"){
    toast(profile&&profile.role!=="driver"?"الحساب ده مش حساب مندوب":"الحساب موجود لكن لا يوجد ملف صلاحيات له");
    await sb.auth.signOut();
    return;
  }
  currentUser=profile;
  showApp();
});

function showApp(){
  $("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");
  $("appTitle").textContent="طلبات "+(currentUser.name||"المندوب");
  loadOrders();
  startLocationWatch();
}

// ============================================================
// تحميل الطلبات (مع تحديث لحظي)
// ============================================================
async function loadOrders(){
  const{data,error}=await sb.from("orders").select("*").eq("driver_id",currentUser.id).order("created_at",{ascending:false});
  if(error){toast("تعذر تحميل الطلبات: "+error.message);return}
  orders=data||[];
  render();
  if(ordersChannel)sb.removeChannel(ordersChannel);
  ordersChannel=sb.channel("orders-changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"orders"},()=>loadOrders())
    .subscribe();
}

// ============================================================
// عرض الطلبات
// ============================================================
function statusClass(s){return s==="جاري التوصيل"?"out":s==="تم التسليم"?"done":s==="ملغي"?"cancel":""}

function render(){
  let list=orders;
  if(filter!=="الكل")list=list.filter(o=>o.status===filter);
  if(searchTerm)list=list.filter(o=>(o.name||"").includes(searchTerm)||(o.phone||"").includes(searchTerm));
  $("stats").textContent=`طلباتك: ${list.length} • تم التسليم: ${list.filter(x=>x.status==="تم التسليم").length}`;
  $("cards").innerHTML=list.length?list.map(o=>{
    const driverActions=`<button class="btn green" onclick="driverStart('${o.id}')">${o.status==="جديد"?"قبول الطلب":"تحديث"}</button>`;
    const statusBtn=`<button class="btn full" onclick="openStatusPicker('${o.id}')">🔄 تغيير الحالة</button>`;
    const extra=(o.status==="تم التسليم"||o.status==="ملغي")
      ?`<button class="btn full" disabled style="opacity:.55">${o.status==="تم التسليم"?"تم التسليم ✓":"تم رفض الطلب ⛔"}</button>${statusBtn}`
      :`<button class="btn full green" onclick="driverDone('${o.id}')">✅ تم التسليم</button><button class="btn full red" onclick="driverReject('${o.id}')">❌ رفض الطلب</button>${statusBtn}`;
    const senderLine=o.sender_name?`<br>👤 من: ${esc(o.sender_name)}`:"";
    const hasLoc=o.client_lat!=null||o.address;
    const addressHtml=hasLoc?`<a href="#" onclick="openMap('${o.id}');return false;" style="color:#087f4f;text-decoration:underline;font-weight:600">${esc(o.address||"")} ${o.client_lat!=null?"📌":"🔍"}</a>`:esc(o.address||"");
    return `<article class="card"><div class="head"><div><div class="name">${esc(o.name)}</div><div class="phone">${esc(o.phone)}</div></div><span class="status ${statusClass(o.status)}">${esc(o.status)}</span></div>
    <div class="info">📍 ${addressHtml}${senderLine}${o.product?`<br>📦 ${esc(o.product)}`:""}${o.amount?`<br>💰 ${o.amount} جنيه`:""}${o.notes?`<br>📝 ${esc(o.notes)}`:""}</div>
    <div class="actions">${driverActions}
    <button class="btn" onclick="openMap('${o.id}')">🗺️ الطريق</button>
    <button class="btn" onclick="sendWA('${o.id}')">💬 واتساب</button>
    <button class="btn" onclick="sendInvoiceWA('${o.id}')">🧾 فاتورة</button>
    <button class="btn" onclick="callClient('${o.id}')">📞 اتصال</button>
    ${extra}</div></article>`;
  }).join(""):`<div class="empty">لا توجد طلبات في هذه القائمة</div>`;
}

document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");filter=b.dataset.f;render();
});
$("search").oninput=e=>{searchTerm=e.target.value.trim();render()};

// ============================================================
// تغيير الحالة
// ============================================================
const STATUS_OPTIONS=["جديد","جاري التوصيل","تم التسليم","ملغي"];
window.openStatusPicker=id=>{
  $("statusList").innerHTML=STATUS_OPTIONS.map(s=>`<button class="btn full" style="margin-bottom:6px;display:block;width:100%" onclick="doStatus('${id}','${s}')">${esc(s)}</button>`).join("");
  $("statusModal").classList.remove("hidden");
};
$("statusClose").onclick=()=>$("statusModal").classList.add("hidden");
window.doStatus=async(id,status)=>{
  const{error}=await sb.from("orders").update({status,updated_at:new Date().toISOString()}).eq("id",id);
  $("statusModal").classList.add("hidden");
  if(error){toast("تعذر تغيير الحالة: "+error.message);return}
  loadOrders();
};

// ============================================================
// أصوات تنبيه (تسليم / رفض)
// ============================================================
function playTone(freqs,dur){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=f;
      o.connect(g);g.connect(ctx.destination);
      const start=ctx.currentTime+i*dur;
      g.gain.setValueAtTime(0,start);
      g.gain.linearRampToValueAtTime(0.3,start+0.02);
      g.gain.linearRampToValueAtTime(0,start+dur*0.9);
      o.start(start);o.stop(start+dur);
    });
  }catch(e){}
}
function playDoneSound(){playTone([880,1175],0.15)}
function playRejectSound(){playTone([440,300],0.22)}

// ============================================================
// أزرار المندوب على الطلب
// ============================================================
async function driverSetStatus(id,status){
  const payload={status,updated_at:new Date().toISOString()};
  if(navigator.geolocation){
    await new Promise(resolve=>{
      navigator.geolocation.getCurrentPosition(pos=>{
        payload.driver_lat=pos.coords.latitude;payload.driver_lng=pos.coords.longitude;
        payload.driver_loc_status=status;payload.driver_loc_at=new Date().toISOString();
        resolve();
      },()=>resolve(),{timeout:5000});
    });
  }
  const{error}=await sb.from("orders").update(payload).eq("id",id);
  if(error){toast("تعذر تحديث الطلب: "+error.message);return}
  if(status==="تم التسليم")playDoneSound();
  else if(status==="ملغي")playRejectSound();
  toast("تم التحديث");loadOrders();
}
window.driverStart=id=>driverSetStatus(id,"جاري التوصيل");
window.driverDone=id=>driverSetStatus(id,"تم التسليم");
window.driverReject=id=>{if(confirm("متأكد من رفض الطلب؟"))driverSetStatus(id,"ملغي")};

// ============================================================
// خرائط / واتساب / اتصال
// ============================================================
window.openMap=id=>{
  const o=orders.find(x=>x.id===id);if(!o)return;
  if(o.client_lat)window.open(`https://www.google.com/maps/search/?api=1&query=${o.client_lat},${o.client_lng}`,"_blank");
  else if(o.address)window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address)}`,"_blank");
  else toast("لا يوجد موقع محدد لهذا الطلب");
};
window.sendWA=id=>{
  const o=orders.find(x=>x.id===id);if(!o)return;
  let p=(o.phone||"").replace(/\D/g,"");if(p.startsWith("0"))p="20"+p.slice(1);
  window.open(`https://wa.me/${p}?text=${encodeURIComponent(`أهلاً ${o.name}، مع حضرتك مندوب التوصيل. طلبك في الطريق إليك.`)}`,"_blank");
};
window.sendInvoiceWA=id=>{
  const o=orders.find(x=>x.id===id);if(!o)return;
  let p=(o.phone||"").replace(/\D/g,"");if(p.startsWith("0"))p="20"+p.slice(1);
  if(!p){toast("لا يوجد رقم هاتف لهذا الطلب");return}
  const amount=Number(o.amount)||0,fee=Number(o.delivery_fee)||0,total=amount+fee;
  let msg=`🧾 *فاتورة الطلب*\n👤 العميل: ${o.name}\n📍 العنوان: ${o.address||"-"}\n`;
  if(o.sender_name)msg+=`🏬 من: ${o.sender_name}\n`;
  if(o.product)msg+=`📦 المنتج: ${o.product}\n`;
  msg+=`——————————\n💰 قيمة الطلب: ${amount} جنيه\n🚚 سعر التوصيل: ${fee} جنيه\n——————————\n✅ الإجمالي: ${total} جنيه\n`;
  if(o.notes)msg+=`📝 ملاحظات: ${o.notes}\n`;
  msg+=`\nشكرًا لتعاملكم معنا 🙏`;
  window.open(`https://wa.me/${p}?text=${encodeURIComponent(msg)}`,"_blank");
};
window.callClient=id=>{const o=orders.find(x=>x.id===id);if(o)window.location.href="tel:"+o.phone};

// ============================================================
// تتبع موقع المندوب (حي)
// ============================================================
function startLocationWatch(){
  if(!navigator.geolocation){toast("المتصفح ده مش بيدعم تحديد الموقع");return}
  if(!currentUser)return;
  watchId=navigator.geolocation.watchPosition(async pos=>{
    const{error}=await sb.from("driver_locations").upsert({driver_id:currentUser.id,lat:pos.coords.latitude,lng:pos.coords.longitude,updated_at:new Date().toISOString()});
    if(error)toast("تعذر إرسال الموقع: "+error.message);
  },err=>{
    const msgs={1:"تم رفض إذن الموقع (GPS). فعّله من إعدادات المتصفح",2:"تعذر تحديد الموقع حاليًا",3:"استغرق تحديد الموقع وقتًا طويلاً"};
    toast(msgs[err.code]||("خطأ في تحديد الموقع: "+err.message));
  },{enableHighAccuracy:true,maximumAge:15000});
}
function stopLocationWatch(){if(watchId!=null&&navigator.geolocation){navigator.geolocation.clearWatch(watchId);watchId=null}}

// ============================================================
// ملخص اليوم للمندوب
// ============================================================
$("dailySummaryBtn").onclick=()=>{
  const today=new Date().toDateString();
  const todayOrders=orders.filter(o=>o.status==="تم التسليم"&&o.updated_at&&new Date(o.updated_at).toDateString()===today);
  const count=todayOrders.length;
  const totalFees=todayOrders.reduce((sum,o)=>sum+(Number(o.delivery_fee)||0),0);
  const totalAmounts=todayOrders.reduce((sum,o)=>sum+(Number(o.amount)||0),0);
  const grandTotal=totalFees+totalAmounts;
  $("summaryContent").innerHTML=`
    <div style="font-size:40px;margin-bottom:6px">📦</div>
    <div style="font-size:15px;color:#65716b">عدد الطلبات المسلَّمة اليوم</div>
    <div style="font-size:32px;font-weight:800;margin:6px 0 18px">${count}</div>
    <div style="font-size:15px;color:#65716b">إجمالي المبلغ (قيمة الطلبات + سعر التوصيل)</div>
    <div style="font-size:32px;font-weight:800;color:#10a66a;margin-bottom:14px">${grandTotal} جنيه</div>
    <div style="font-size:12px;color:#8a948e">قيمة الطلبات: ${totalAmounts} جنيه • سعر التوصيل: ${totalFees} جنيه</div>
  `;
  $("summaryModal").classList.remove("hidden");
};
$("summaryClose").onclick=()=>$("summaryModal").classList.add("hidden");

// ============================================================
// إغلاق المودالات بالنقر على الخلفية
// ============================================================
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.add("hidden")}));

// فحص أولي: هل فيه جلسة محفوظة بالفعل؟
sb.auth.getSession().then(({data})=>{
  if(!data.session)$("login").classList.remove("hidden");
});

// تسجيل الـ Service Worker عشان يبقى البرنامج قابل للتثبيت كتطبيق (PWA)
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
