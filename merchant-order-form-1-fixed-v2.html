<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صفحة التاجر - إضافة طلب</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#171b23;font-family:'Tajawal',Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.header{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:20px 16px;display:flex;align-items:center;justify-content:space-between}
.header h1{margin:0;font-size:19px;font-weight:800}
.logout{border:0;border-radius:9px;padding:7px 12px;background:#ffffff22;color:#fff;font-weight:700;font-size:13px}
.wrap{max-width:520px;margin:auto;padding:16px;width:100%}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 14px #17203514;border:1px solid #eef1f7}
label{display:block;font-size:13px;font-weight:700;margin:11px 0}
label input,label textarea{display:block;width:100%;margin-top:5px;border:1px solid #d9e2de;border-radius:11px;background:#fff;padding:12px;outline:0;color:#171b23;transition:border-color .15s,box-shadow .15s}
label input:focus,label textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb26}
.save{width:100%;border:0;background:#2563eb;color:#fff;border-radius:12px;padding:14px;margin-top:16px;font-weight:800;font-size:15px}
.save:disabled{opacity:.6}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#171b23;color:#fff;padding:10px 16px;border-radius:11px;opacity:0;transition:.2s;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
.login{min-height:80vh;display:flex;align-items:center;justify-content:center}
.loginCard{width:min(420px,100%);background:#fff;border-radius:20px;padding:26px;box-shadow:0 5px 25px #00000012;text-align:center}
.loginIcon{font-size:46px}
.welcome{font-weight:800;font-size:15px;margin:0 0 4px}
.hint{font-size:11px;color:#8a938e;margin-top:4px}
.recentItem{background:#f6f8fd;border-radius:10px;padding:9px 11px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.recentTitle{font-weight:700;margin:16px 0 8px;font-size:13px}
</style>
</head>
<body>
<div class="header"><h1>🏪 صفحة التاجر</h1><button id="logoutBtn" class="logout hidden">خروج</button></div>

<div id="loginSection" class="wrap login">
<div class="loginCard">
<div class="loginIcon">🏪</div>
<h2 style="margin:8px 0">دخول التاجر</h2>
<label>اسم المستخدم<input id="loginUser" type="text" placeholder="shop1" autocomplete="username"></label>
<label>كلمة المرور<input id="loginPass" type="password" placeholder="كلمة المرور" autocomplete="current-password"></label>
<button id="loginBtn" class="save">دخول</button>
</div>
</div>

<div id="appSection" class="wrap hidden">
<div class="card">
<p class="welcome">مرحبًا <span id="welcomeName"></span> 👋</p>
<form id="form" autocomplete="off">
<label>اسم العميل<input id="fName" type="text" required placeholder="مثال: أحمد محمد"></label>
<label>رقم الهاتف<input id="fPhone" type="tel" required placeholder="01012345678"></label>
<label>رقم تليفون احتياطي (اختياري)<input id="fPhone2" type="tel" placeholder="01098765432"></label>
<label>العنوان بالتفصيل<input id="fAddress" type="text" required placeholder="مثال: شارع النصر، مدينة نصر، القاهرة"></label>
<label>اسم/وصف المنتج<input id="fProduct" type="text" placeholder="مثال: بلوفر أزرق مقاس L"></label>
<label>قيمة الطلب (اختياري)<input id="fAmount" type="number" min="0" step="0.01" placeholder="350"></label>
<label>ملاحظات (اختياري)<textarea id="fNotes" rows="3" placeholder="أي تفاصيل إضافية"></textarea></label>
<button id="submitBtn" class="save" type="submit">إضافة الطلب</button>
<div class="hint">هيتحط اسمك تلقائيًا كمرسل للطلب، وهيظهر عند الأدمن والمشرف على طول</div>
</form>
<div class="recentTitle">آخر الطلبات اللي أضفتها</div>
<div id="recentList"></div>
</div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";
const SUPABASE_URL="https://urfxuimhyvwfjnfjsojp.supabase.co";
const SUPABASE_KEY="sb_publishable_sknSMSPhfT7gOkoiG-w1lQ_uamIQGdz";
// خليت الجلسة في sessionStorage عشان لو فاتح صفحة الأدمن أو المندوب في تاب
// تاني في نفس المتصفح، الجلستين ميتلخبطوش في بعض.
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:window.sessionStorage}});

function $(id){return document.getElementById(id)}
let toastTimer=null;
function toast(msg){
  const t=$("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),3200);
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

let currentUser=null;

$("loginBtn").onclick=async()=>{
  const u=$("loginUser").value.trim(),p=$("loginPass").value;
  if(!u||!p){toast("اكتب اسم المستخدم وكلمة المرور");return}

  // اسم المستخدم يُستخدم للبحث عن الإيميل المحفوظ للتاجر في قاعدة البيانات.
  $("loginBtn").disabled=true;$("loginBtn").textContent="جاري الدخول...";

  const {data:merchant,error:merchantError}=await sb
    .from("app_users")
    .select("email")
    .eq("username",u.toLowerCase())
    .eq("role","merchant")
    .maybeSingle();

  if(merchantError || !merchant || !merchant.email){
    $("loginBtn").disabled=false;$("loginBtn").textContent="دخول";
    toast("اسم المستخدم غير موجود");
    return;
  }

  const{error}=await sb.auth.signInWithPassword({email:merchant.email,password:p});
  $("loginBtn").disabled=false;$("loginBtn").textContent="دخول";
  if(error){toast(error.message==="Invalid login credentials"?"اسم المستخدم أو كلمة المرور غلط":"تعذر الدخول: "+error.message);return}
};

$("logoutBtn").onclick=async()=>{await sb.auth.signOut()};

sb.auth.onAuthStateChange(async(event,session)=>{
  if(!session){
    currentUser=null;
    $("appSection").classList.add("hidden");
    $("loginSection").classList.remove("hidden");
    $("logoutBtn").classList.add("hidden");
    return;
  }
  const{data:profile,error}=await sb.from("app_users").select("*").eq("auth_uid",session.user.id).maybeSingle();
  if(error||!profile||profile.role!=="merchant"){
    toast("الحساب ده مش حساب تاجر");
    await sb.auth.signOut();
    return;
  }
  currentUser=profile;
  $("welcomeName").textContent=currentUser.name;
  $("loginSection").classList.add("hidden");
  $("appSection").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  loadRecent();
});

async function loadRecent(){
  const{data,error}=await sb.from("orders").select("*").eq("sender_name",currentUser.name).order("created_at",{ascending:false}).limit(15);
  if(error)return;
  $("recentList").innerHTML=(data||[]).length?(data||[]).map(o=>`<div class="recentItem"><span>${esc(o.name)}</span><span>${esc(o.status)}</span></div>`).join(""):"<div style='color:#8a938e;font-size:13px'>لسه مفيش طلبات</div>";
}

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("fName").value.trim();
  const phone=$("fPhone").value.trim();
  if(!name||!phone){toast("من فضلك اكتب الاسم ورقم الهاتف");return}
  if(!$("fAddress").value.trim()){toast("من فضلك اكتب العنوان");return}
  $("submitBtn").disabled=true;$("submitBtn").textContent="جاري الإضافة...";
  const payload={
    name:name,
    phone:phone,
    phone2:$("fPhone2").value.trim(),
    address:$("fAddress").value.trim(),
    product:$("fProduct").value.trim(),
    amount:Number($("fAmount").value)||0,
    notes:$("fNotes").value.trim(),
    sender_name:currentUser.name,
    status:"جديد",
    work_date:todayStr()
  };
  const{error}=await sb.from("orders").insert(payload);
  $("submitBtn").disabled=false;$("submitBtn").textContent="إضافة الطلب";
  if(error){toast("تعذر إضافة الطلب: "+error.message);return}
  toast("تم إضافة الطلب");
  $("form").reset();
  loadRecent();
});
</script>
</body>
</html>
